<script>
window.__SCENE = {"leitfrage": "Warum geht uns dieser ferne Krieg etwas an?", "merksatz": "Der Krieg trieb Menschen bis nach Deutschland, wo ihre Ankunft heftig umstritten war.", "flow_shape": "chain", "canvas": {"w": 920, "h": 727}, "nodes": [{"id": "n0", "text": "Städte in Trümmern", "role": "normal", "kind": "box", "x": 342.0, "y": 90, "w": 236, "h": 64, "accent": null, "seed": 100}, {"id": "n1", "text": "Kinder als Opfer", "role": "normal", "kind": "box", "x": 342.0, "y": 188, "w": 236, "h": 64, "accent": null, "seed": 101}, {"id": "n2", "text": "Weißhelme graben nach Überlebenden", "role": "normal", "kind": "box", "x": 342.0, "y": 286, "w": 236, "h": 72, "accent": null, "seed": 102}, {"id": "n3", "text": "Flucht: Binnen und Nachbarländer", "role": "normal", "kind": "box", "x": 342.0, "y": 392, "w": 236, "h": 72, "accent": null, "seed": 103}, {"id": "n4", "text": "Deutschland wichtigstes Zielland", "role": "normal", "kind": "box", "x": 342.0, "y": 498, "w": 236, "h": 72, "accent": null, "seed": 104}, {"id": "n5", "text": "München 2015: Willkommenskultur und Streit", "role": "normal", "kind": "box", "x": 342.0, "y": 604, "w": 236, "h": 93, "accent": null, "seed": 105}], "relations": [{"from": "n0", "to": "n1", "kind": "arrow", "points": [[460.0, 154], [460.0, 188]], "seed": 151}, {"from": "n1", "to": "n2", "kind": "arrow", "points": [[460.0, 252], [460.0, 286]], "seed": 152}, {"from": "n2", "to": "n3", "kind": "arrow", "points": [[460.0, 358], [460.0, 392]], "seed": 153}, {"from": "n3", "to": "n4", "kind": "arrow", "points": [[460.0, 464], [460.0, 498]], "seed": 154}, {"from": "n4", "to": "n5", "kind": "arrow", "points": [[460.0, 570], [460.0, 604]], "seed": 155}], "meta": {"gestalter_notiz": "Lineare Ereigniskette (ein Strang: vom Kriegsgeschehen in Syrien bis zur Ankunftsdebatte in Deutschland) - kette_vertikal mit Pfeil-Fluss, uniforme Boxen ohne Sequenz-Farbe, da kein paralleler Strang vorliegt."}};
if (document.fonts && document.fonts.load) {
  document.fonts.load("18px 'Excalifont'").then(function(){return document.fonts.ready;}).then(run).catch(run);
  setTimeout(function(){ if(!window.__tafelbildReady) run(); }, 2500);
} else { run(); }
function run(){ 
(function(){
  var P = {"red": "#e03131", "blau": "#1971c2", "violett": "#9c36b5", "orange": "#e8590c", "grau": "#868e96", "ink": "#222019"};
  var S = window.__SCENE;
  var MERK_H = 130;
  var W = S.canvas.w, H = S.canvas.h + MERK_H;
  var DPR = 2;
  var cv = document.getElementById('c');
  cv.width = W*DPR; cv.height = H*DPR; cv.style.width = W+'px'; cv.style.height = H+'px';
  var ctx = cv.getContext('2d'); ctx.scale(DPR,DPR);
  ctx.fillStyle = '#fdfaf0'; ctx.fillRect(0,0,W,H);
  var rc = rough.canvas(cv);
  var FONT = "'Excalifont','Patrick Hand',sans-serif";

  function accentColor(a){ return a ? (P[a]||P.ink) : P.ink; }

  function wrap(text, maxw, font){
    ctx.font = font; var words = String(text).split(' '), lines=[], cur='';
    for (var i=0;i<words.length;i++){
      var t = cur ? cur+' '+words[i] : words[i];
      if (ctx.measureText(t).width > maxw && cur){ lines.push(cur); cur = words[i]; }
      else cur = t;
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function textBlock(x, y, w, text, color, px, align){
    var font = px+"px "+FONT;
    var lines = wrap(text, w-24, font);
    ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align||'center';
    ctx.textBaseline = 'middle';
    var lh = px+3, sy = y - (lines.length-1)*lh/2;
    var tx = align==='left' ? x+12 : x+w/2;
    for (var i=0;i<lines.length;i++) ctx.fillText(lines[i], tx, sy+i*lh);
  }
  function arrowhead(x,y,ang,color,seed){
    var a=8, sp=0.5;
    rc.line(x,y, x-a*Math.cos(ang-sp), y-a*Math.sin(ang-sp), {stroke:color,strokeWidth:1.6,roughness:1.1,seed:seed});
    rc.line(x,y, x-a*Math.cos(ang+sp), y-a*Math.sin(ang+sp), {stroke:color,strokeWidth:1.6,roughness:1.1,seed:seed});
  }

  // Leitfrage (rot + unterstrichen)
  ctx.font = "27px "+FONT; ctx.fillStyle = P.red; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(S.leitfrage, 40, 56);
  var lfw = ctx.measureText(S.leitfrage).width;
  rc.line(40,68, 40+lfw,68, {stroke:P.red, strokeWidth:1.6, roughness:1.4, seed:7});

  // Relationen (unter den Knoten zeichnen)
  S.relations.forEach(function(r){
    var pts = r.points;
    if (pts.length >= 3) rc.curve(pts, {stroke:P.blau, strokeWidth:1.7, roughness:1.2, seed:r.seed, bowing:1.2});
    else rc.line(pts[0][0],pts[0][1],pts[1][0],pts[1][1], {stroke:P.blau, strokeWidth:1.7, roughness:1.1, seed:r.seed});
    var e = pts[pts.length-1], c = pts[pts.length-2];
    arrowhead(e[0],e[1], Math.atan2(e[1]-c[1], e[0]-c[0]), P.blau, r.seed);
  });

  // Knoten
  // two_column Zeilen-Schiene: zarte Hairline im Spalt verbindet jedes Links-Rechts-Paar,
  // damit das Auge beim Quervergleich die Zeile nicht verliert (FORM-Audit lrs 2026-06-27).
  if (S.flow_shape === 'two_column'){
    var rows = {};
    S.nodes.forEach(function(n){ if (n.kind === 'box'){ var k=Math.round(n.y); (rows[k]=rows[k]||[]).push(n); } });
    Object.keys(rows).forEach(function(k){
      var rs = rows[k]; if (rs.length < 2) return;
      var left = rs.reduce(function(a,b){ return a.x < b.x ? a : b; });
      var right = rs.reduce(function(a,b){ return a.x > b.x ? a : b; });
      var yc = left.y + left.h/2;
      rc.line(left.x+left.w-4, yc, right.x+4, yc, {stroke:P.grau, strokeWidth:1.0, roughness:1.4, seed:300+Math.round(k)});
    });
  }

  S.nodes.forEach(function(n){
    var col = accentColor(n.accent);
    if (n.kind === 'box' || n.kind === 'cell'){
      rc.rectangle(n.x, n.y, n.w, n.h, {stroke:col, strokeWidth:(n.accent==='violett'?2.4:1.5),
        roughness:1.25, fillStyle:'solid', fill:'#fffdf6', seed:n.seed});
      textBlock(n.x, n.y+n.h/2, n.w, n.text, P.ink, 18, (n.kind==='cell'?'left':'center'));
    } else if (n.kind === 'crit'){
      rc.rectangle(n.x, n.y, n.w, n.h, {stroke:P.grau, strokeWidth:1.4, roughness:1.25,
        fillStyle:'solid', fill:'#fffdf6', seed:n.seed});
      textBlock(n.x, n.y+n.h/2, n.w, n.text, P.grau, 17, 'left');
    } else if (n.kind === 'header'){
      var hc = accentColor(n.accent==='violett'?'violett':'blau');
      textBlock(n.x, n.y+n.h/2, n.w, n.text, hc, 18, 'left');
      var hy = n.y + n.h - 6;
      rc.line(n.x+6, hy, n.x+n.w-6, hy, {stroke:hc, strokeWidth:1.4, roughness:1.3, seed:n.seed});
    } else { // bullet
      rc.line(n.x, n.y+n.h/2, n.x+10, n.y+n.h/2, {stroke:P.blau, strokeWidth:2.0, roughness:1.0, seed:n.seed});
      textBlock(n.x+18, n.y+n.h/2, n.w-18, n.text, P.ink, 18, 'left');
    }
    if (n.nummer){   // Lese-Reihenfolge-Badge (nur Kreislauf): kleiner nummerierter Kreis an der Box-Ecke
      var bx=n.x, by=n.y;
      rc.circle(bx, by, 26, {stroke:P.blau, strokeWidth:1.6, roughness:1.0, fillStyle:'solid', fill:'#fdfaf0', seed:n.seed+7});
      ctx.font="15px "+FONT; ctx.fillStyle=P.blau; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(n.nummer), bx, by);
    }
  });

  // Merksatz (violetter Kasten, unter der Scene)
  var mx=40, my=S.canvas.h+8, mw=W-80, mh=MERK_H-24;
  rc.rectangle(mx, my, mw, mh, {stroke:P.violett, strokeWidth:2.4, roughness:1.0,
    fillStyle:'solid', fill:'#f7edfb', seed:9});
  ctx.font = "22px "+FONT; ctx.fillStyle = P.violett; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText("Merksatz:", mx+18, my+16);
  var mlw = ctx.measureText("Merksatz:").width;
  rc.line(mx+18, my+42, mx+18+mlw, my+42, {stroke:P.violett, strokeWidth:1.4, roughness:1.3, seed:11});
  ctx.fillStyle = P.ink; ctx.font = "21px "+FONT;
  var ml = wrap(S.merksatz, mw-36, "21px "+FONT);
  for (var i=0;i<ml.length;i++) ctx.fillText(ml[i], mx+18, my+52+i*26);

  window.__tafelbildReady = true;
})();
 }
</script>
<script>
(function(){function fit(){try{if(window.frameElement){window.frameElement.style.height=document.documentElement.scrollHeight+'px';window.frameElement.setAttribute('scrolling','no');}}catch(e){}}
window.addEventListener("load",fit);window.addEventListener("resize",fit);setTimeout(fit,150);setTimeout(fit,600);})();
