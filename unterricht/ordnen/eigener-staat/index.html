<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mein eigener Staat</title>
<link rel="stylesheet" href="../../assets/css/material.css?v=1.0">
<link rel="stylesheet" href="../ordnen.css?v=1.2">
<style>
  /* Nur diese Aufgabe: kompakte Karten, damit an der Tafel alle zwölf auf einen Blick passen (Lehrkraft ordnet im Plenum). */
  @media (min-width: 900px) {
    .o-huelle { max-width: 1100px; }
    .o-karte { grid-template-columns: 64px 1fr auto; padding: 2px 10px 2px 6px; margin-bottom: 5px; }
    .o-bild { height: 50px; }
    .o-huelle { padding-top: 6px; }
    .o-kopf { padding: 4px 2px 8px; }
    .o-titel { font-size: 1.25rem; margin: 0 0 1px; }
    .o-satz { font-size: 1rem; }
  }
</style>
</head>
<body class="ordnen">
<div class="o-huelle">

  <header class="o-kopf">
    <h1 id="o-leitfrage">…</h1>
    <p id="o-auftrag"></p>
  </header>

  <ol class="o-liste" id="o-liste"></ol>

  <section class="o-fragen" id="o-fragen" hidden>
    <h2>Fragen zum Schluss</h2>
    <p class="o-hinweis">Eure Antworten bleiben nur auf diesem Gerät und sind nach dem Neuladen weg.
      Ins Heft kommt ein Satz von der Tafel – hier geht es ums Begründen.</p>
  </section>

  <section class="o-nachweis" id="o-nachweis">
    <h3>Bilder</h3>
  </section>

</div>

<div class="o-leiste">
  <button type="button" class="o-knopf" id="o-pruefen">Prüfen</button>
  <button type="button" class="o-knopf o-zweit" id="o-zu-fragen">Zu den Fragen</button>
  <span class="o-stand" id="o-stand"></span>
</div>

<script src="../ordnen.js?v=1.2"></script>
</body>
</html>
