<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Anordnen — Aufgaben</title>
<link rel="stylesheet" href="ordnen.css">
<style>
  .o-wahl { list-style: none; margin: 18px 0 0; padding: 0; }
  .o-wahl a {
    display: block; text-decoration: none; color: inherit;
    background: var(--o-flaeche); border: 1px solid var(--o-linie);
    border-radius: var(--o-radius); box-shadow: var(--o-schatten);
    padding: 18px 16px; margin-bottom: 12px;
  }
  .o-wahl strong { display: block; font-size: 1.12rem; margin-bottom: 3px; color: var(--o-akzent); }
  .o-wahl span { font-size: .92rem; color: var(--o-gedaempft); }
</style>
</head>
<body class="ordnen">
<div class="o-huelle">
  <header class="o-kopf">
    <h1>Anordnen</h1>
    <p>Tippe die Aufgabe an, die deine Lehrkraft genannt hat.</p>
  </header>
  <ul class="o-wahl">
    <li><a href="kaiserreich/">
      <strong>Vom Kaiserreich zur Republik</strong>
      <span>GPG 8 · Zwölf Karten in die richtige Reihenfolge bringen</span>
    </a></li>
  </ul>
</div>
</body>
</html>
